name: Build VST3

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target DDIEGO_Y2K_FX_VST3 --parallel

      - name: Locate plugin
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path . -Recurse -Filter "DDIEGO Y2K FX.vst3" -Directory | Select-Object -First 1
          if (-not $plugin) {
            Write-Error "VST3 was not found."
          }
          Write-Host "Found: $($plugin.FullName)"
          "PLUGIN_PATH=$($plugin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path "$env:PLUGIN_PATH" -Destination artifact -Recurse
          Compress-Archive -Path artifact/* -DestinationPath DDIEGO-Y2K-FX-VST3.zip -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDIEGO-Y2K-FX-VST3
          path: DDIEGO-Y2K-FX-VST3.zip
